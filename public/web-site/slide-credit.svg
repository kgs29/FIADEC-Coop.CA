<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration crédit et financement FIADEC">
  <defs>
    <linearGradient id="bgCredit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3320"/>
      <stop offset="55%" stop-color="#145c34"/>
      <stop offset="100%" stop-color="#2f9152"/>
    </linearGradient>
    <radialGradient id="glowC" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsC" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgCredit)"/>
  <rect width="1600" height="900" fill="url(#glowC)"/>
  <rect width="1600" height="900" fill="url(#dotsC)"/>

  <circle cx="1380" cy="180" r="240" fill="#ffffff" opacity="0.05"/>
  <circle cx="150" cy="740" r="180" fill="#ffffff" opacity="0.05"/>

  <!-- Contract / credit agreement -->
  <g transform="translate(1080,300)">
    <rect x="-140" y="0" width="280" height="360" rx="18" fill="#ffffff" opacity="0.95" transform="rotate(-4 0 180)"/>
    <g transform="rotate(-4 0 180)" stroke="#145c34" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="-95" y1="70" x2="95" y2="70"/>
      <line x1="-95" y1="105" x2="95" y2="105"/>
      <line x1="-95" y1="140" x2="40" y2="140"/>
      <line x1="-95" y1="230" x2="95" y2="230"/>
      <line x1="-95" y1="265" x2="60" y2="265"/>
    </g>
    <circle cx="90" cy="290" r="58" fill="#f2c14e"/>
    <path d="M62,290 L82,312 L120,266" fill="none" stroke="#0b3320" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coin stack with growing sprout -->
  <g transform="translate(280,470)">
    <ellipse cx="0" cy="230" rx="150" ry="26" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="195" rx="140" ry="24" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="0" cy="162" rx="128" ry="22" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="0" cy="132" rx="112" ry="20" fill="#f2c14e" opacity="0.95"/>
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0b3320" text-anchor="middle">₣</text>
    <path d="M0,110 C-10,60 20,40 0,-30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <path d="M0,10 C-40,-10 -60,-50 -30,-80 C0,-60 10,-30 0,10 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M0,-20 C40,-40 60,-80 30,-110 C0,-90 -10,-60 0,-20 Z" fill="#ffffff" opacity="0.75"/>
  </g>

  <circle cx="700" cy="700" r="8" fill="#f2c14e" opacity="0.9"/>
  <circle cx="1200" cy="700" r="6" fill="#ffffff" opacity="0.6"/>
</svg>
